<!DOCTYPE html>
<html>
<head>
    <title>Flask Todo</title>
</head>
<body>
    <h1>My To-Do List</h1>
    <form action="/add" method="POST">
        <input type="text" name="todo" placeholder="Add a task..." required>
        <button type="submit">Add</button>
    </form>
    <ul>
        {% for todo in todos %}
            <li>
                {{ todo.task }} 
                <a href="{{ url_for('delete', index=loop.index0) }}">[Delete]</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
